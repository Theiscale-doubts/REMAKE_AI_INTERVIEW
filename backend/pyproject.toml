[project]
name = "voxhire-backend"
version = "1.0.0"
description = "VoxHire — AI-powered voice interview platform API"
requires-python = ">=3.11"

# Runtime dependencies are pinned in requirements.txt (what Render installs);
# this section exists so the project is a real, importable package rather than
# a folder of loose scripts.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
# rootdir is backend/, so "app" imports resolve without any sys.path juggling
# in the test files themselves.
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.testclient",
]
